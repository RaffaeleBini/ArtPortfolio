<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio of Raffaele Bini — creative engineer." />
  <title>Raffaele Bini — Art Portfolio</title>
  <!-- Set theme before CSS loads to prevent flash -->
  <script>
    (function () {
      var pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', pref);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="#hero" class="logo" aria-label="Raffaele Bini — back to top">Raffaele Bini</a>

      <nav class="site-nav" aria-label="Primary navigation">
        <ul role="list">
          <li><a href="#hero">Home</a></li>
          <li><a href="#works">Works</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
        <!-- Sun: shown in dark mode to switch to light -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon: shown in light mode to switch to dark -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="main-content">

    <!-- Hero -->
    <section id="hero" class="hero" aria-label="Introduction">
      <div class="container">
        <h1 class="hero-title">Raffaele Bini</h1>
        <p class="hero-tagline">Creative engineer based in Santiago de Compostela.</p>
      </div>
    </section>

    <!-- Works -->
    <section id="works" class="works" aria-labelledby="works-heading">
      <div class="container">
        <h2 class="section-title" id="works-heading">Works</h2>

        <div class="filter-bar" role="group" aria-label="Filter artworks by category">
          <button class="filter-btn active" data-filter="all" type="button" aria-pressed="true">All</button>
          <button class="filter-btn" data-filter="paintings" type="button" aria-pressed="false">Paintings</button>
          <button class="filter-btn" data-filter="drawings" type="button" aria-pressed="false">Drawings</button>
        </div>

        <div class="gallery-grid" id="gallery-grid" role="list" aria-label="Artwork gallery"></div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="about" aria-labelledby="about-heading">
      <div class="container about-inner">
        <div class="about-text">
          <h2 class="section-title" id="about-heading">About</h2>
          <p id="about-bio"></p>
        </div>
        <div class="about-image">
          <figure>
            <img
              src="assets/artist/portrait.jpg"
              alt="Raffaele"
              class="artist-photo"
              onerror="this.closest('.about-image').style.display='none'"
            />
          </figure>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="contact" aria-labelledby="contact-heading">
      <div class="container">
        <div class="contact-inner">
          <h2 class="section-title" id="contact-heading">Contact</h2>

          <form id="contact-form" novalidate>
            <div class="form-group">
              <label for="field-name">Name</label>
              <input
                type="text"
                id="field-name"
                name="name"
                autocomplete="name"
                required
                aria-describedby="error-name"
              />
              <span class="field-error" id="error-name" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="field-email">Email</label>
              <input
                type="email"
                id="field-email"
                name="email"
                autocomplete="email"
                required
                aria-describedby="error-email"
              />
              <span class="field-error" id="error-email" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="field-message">Message</label>
              <textarea
                id="field-message"
                name="message"
                rows="6"
                required
                aria-describedby="error-message"
              ></textarea>
              <span class="field-error" id="error-message" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-footer">
              <button type="submit" class="btn-submit">Send message</button>
              <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <p class="footer-copy">&copy; <span id="footer-year"></span> Raffaele Bini. All rights reserved.</p>
      <a href="#hero" class="back-to-top" aria-label="Back to top of page">&uarr; Top</a>
    </div>
  </footer>

  <!-- Artwork modal / lightbox -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" aria-hidden="true"></div>
    <div class="modal-dialog">
      <button class="modal-close" id="modal-close" type="button" aria-label="Close artwork">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <figure class="modal-figure">
        <img class="modal-image" id="modal-image" src="" alt="" />
        <figcaption class="modal-caption">
          <h3 class="modal-title" id="modal-title"></h3>
          <p class="modal-meta" id="modal-meta"></p>
        </figcaption>
      </figure>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
